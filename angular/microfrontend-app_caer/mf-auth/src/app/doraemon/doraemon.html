<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center;" class="scene">
	<div class="doraemon" aria-label="Animated Doraemon" role="img">
		<div class="head">
			<div class="face"></div>
			<div class="eye left"><div class="pupil"></div></div>
			<div class="eye right"><div class="pupil"></div></div>
			<div class="nose"></div>
			<div class="nose-line"></div>
			<div class="mouth"></div>
			<div class="whisker l1"></div>
			<div class="whisker l2"></div>
			<div class="whisker l3"></div>
			<div class="whisker r1"></div>
			<div class="whisker r2"></div>
			<div class="whisker r3"></div>
		</div>

		<div class="body">
			<div class="collar"></div>
			<div class="bell"></div>
			<div class="belly"></div>
		</div>
	</div>

	<button class="btn" style="padding: 0.5rem 1rem; font-size: 1rem; border: none; border-radius: 8px; background-color: #007bff; color: white; cursor: pointer;" aria-label="Back to MF home" type="button" [routerLink]="['mf-auth']">Back to MF home</button>
</div>
