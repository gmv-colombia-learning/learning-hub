<section class="mt-5">
  <table class="table table-md mt-2 w-full">
    <thead>
      <tr>
        <th>#</th>
        <th>Ícono</th>
        <th>Bandera</th>
        <th>Nombre</th>
        <th>Capital</th>
        <th>Población</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (country of countries(); track country.codes.alpha_2; let index = $index) {
      <tr>
        <td>{{ index + 1 }}</td>
        <td>{{ country.flag.emoji }}</td>
        <td>
          <img 
            [src]="country.flag.url_svg" 
            [alt]="country.names.common" 
            class="w-10 h-10 rounded-full object-cover" 
          />
        </td>
      </tr>
      }

    </tbody>
  </table>
</section>
